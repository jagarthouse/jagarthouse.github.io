name: Sync Fork with Upstream

on:
  schedule:
    # Run every hour
    - cron: '0 * * * *'
  workflow_dispatch:
    # Allows manual triggering from the GitHub UI

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync Fork
        uses: aormsby/Fork-Sync-With-Upstream-action@v1.0.0
        with:
          upstream_sync_repo: 'ORIGINAL-OWNER/ORIGINAL-REPOSITORY'
          upstream_sync_branch: 'main'
          target_branch: 'main'
          github_token: ${{ secrets.GITHUB_TOKEN }}
